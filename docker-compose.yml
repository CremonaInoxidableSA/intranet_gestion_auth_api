services:
  db:
    image: mysql:8.0
    container_name: mysql-db-api-auth
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - intranet_gestion_auth_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    build: .
    container_name: intranet_gestion_auth_api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - /home/ec2-user/.aws:/root/.aws:ro
    networks:
      - intranet_gestion_auth_network
    depends_on:
      - db
    environment:
      DB_HOST: db

volumes:
  mysql_data:

networks:
  intranet_gestion_auth_network:
    external: true