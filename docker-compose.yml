services:
  db:
    image: mysql:8.0
    container_name: mysql-db-api-auth
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - intranet_gestion_auth_network
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: intranet_gestion_auth_api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - /home/ec2-user/.aws:/root/.aws:ro
    networks:
      - intranet_gestion_auth_network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-api-auth
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - intranet_gestion_auth_network
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    container_name: certbot-api-auth
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  mysql_data:

networks:
  intranet_gestion_auth_network:
    external: true